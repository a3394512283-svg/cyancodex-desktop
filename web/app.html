<!doctype html>
<html lang="zh-CN" data-theme="dark" data-desktop="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>CyanCodex 桌面版</title>
<meta name="theme-color" content="#0E1512">

<meta name="format-detection" content="telephone=no">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/web/icon-192.png" sizes="192x192">

<body>

<div id="app">
  <!-- 液态玻璃光斑背景（纯 CSS 动画，无 JS） -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
  <div class="bg-glow bg-glow-4"></div>

  <header class="topbar">
    <div class="brand" data-go="home">
      <img src="/web/icon-192.png" alt="CyanCodex" width="30" height="30">
      <span>
        <b>CyanCodex</b>
        <small>桌面版</small>
      </span>
    </div>
    <div class="sp"></div>
    <span class="badge" id="verBadge" title="当前版本">v—</span>
    <div id="authSlot"></div>
    <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path id="themeIcon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
    <a class="icon-btn" href="/#download" title="下载 App" aria-label="下载 App">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>
      </svg>
    </a>
  </header>

  <main id="main" role="main"></main>

  <nav class="bottom-nav" role="navigation">
    <button class="nav-item active" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"

        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
      </svg>
      <span class="nav-txt">首页</span>
    </button>
    <button class="nav-item" data-page="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5z"/>
        <path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14z"/>
      </svg>
      <span class="nav-txt">指令库</span>
    </button>
    <button class="nav-item" data-page="tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="m14.7 6.3 3 3"/><path d="M4 20l4-1 9.5-9.5a2.1 2.1 0 0 0-3-3L5 16z"/>
      </svg>
      <span class="nav-txt">生成器</span>
    </button>
    <button class="nav-item" data-page="ai">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.6A8 8 0 0 1 13 4a8 8 0 0 1 8 8z"/>

    <button class="nav-item" data-page="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
      </svg>
      <span class="nav-txt">更多</span>
    </button>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/web/gen.js?v=20261017g"></script>
